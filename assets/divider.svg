<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="6" viewBox="0 0 1200 6" role="presentation">
  <defs>
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a56db">
        <animate attributeName="stop-color" values="#1a56db;#60a5fa;#1a56db" dur="3s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#60a5fa">
        <animate attributeName="stop-color" values="#60a5fa;#1a56db;#60a5fa" dur="3s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#1a56db">
        <animate attributeName="stop-color" values="#1a56db;#60a5fa;#1a56db" dur="3s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>
  <rect width="1200" height="6" rx="3" fill="url(#shimmer)" />
</svg>
